name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build, vet, format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  # Note: go test is intentionally not run here. The otcdns client tests and
  # the cert-manager conformance test in main_test.go both require live OTC
  # credentials and resolve against real OTC DNS servers - they are meant to
  # be run locally (see README.md > Development).
